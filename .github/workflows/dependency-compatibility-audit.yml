name: Dependency Compatibility Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/update-pom-dependencies

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Audit latest stable dependency versions one by one
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          pom = Path('automation/pom.xml')
          raw = pom.read_text(encoding='utf-8')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.fromstring(raw)
          deps = []
          for dep in root.find('m:dependencies', ns):
              g = dep.findtext('m:groupId', namespaces=ns)
              a = dep.findtext('m:artifactId', namespaces=ns)
              v = dep.findtext('m:version', namespaces=ns)
              if g and a and v and not v.startswith('${'):
                  deps.append((g, a, v))

          prerelease = re.compile(r'(?i)(?:alpha|beta|snapshot|milestone|preview|experimental|\brc\d*|\bcr\d*|(?:^|[.-])m\d+(?:[.-]|$)|(?:^|[.-])ea(?:[.-]|$))')

          def latest_stable(g, a):
              url = 'https://repo1.maven.org/maven2/' + g.replace('.', '/') + '/' + a + '/maven-metadata.xml'
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      meta = ET.fromstring(r.read())
              except Exception as exc:
                  return None, f'metadata unavailable: {exc}'
              versions = [x.text.strip() for x in meta.findall('./versioning/versions/version') if x.text]
              stable = [v for v in versions if not prerelease.search(v)]
              if not stable:
                  return None, 'no stable release found'
              return stable[-1], ''

          lines = ['# Dependency compatibility audit', '', '| Dependency | Current | Latest stable | Java 8 build |', '|---|---:|---:|---|']
          Path('/tmp/dependency-candidates.tsv').write_text('', encoding='utf-8')
          with Path('/tmp/dependency-candidates.tsv').open('a', encoding='utf-8') as f:
              for g, a, current in deps:
                  latest, note = latest_stable(g, a)
                  if latest:
                      f.write(f'{g}\t{a}\t{current}\t{latest}\n')
                  else:
                      lines.append(f'| `{g}:{a}` | `{current}` | — | {note} |')
          Path('/tmp/report-prefix.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          cp automation/pom.xml /tmp/original-pom.xml
          cp /tmp/report-prefix.md dependency-audit.md

          # monte-repack declares dead JAI/JMF repositories. Add exclusions only in the
          # ephemeral audit copy so unrelated dependency checks can resolve normally.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/original-pom.xml')
          s = p.read_text(encoding='utf-8')
          marker = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t</dependency>'''
          replacement = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t\t<exclusions>\n\t\t\t\t<exclusion><groupId>javax.media.jai</groupId><artifactId>com.springsource.javax.media.jai.core</artifactId></exclusion>\n\t\t\t\t<exclusion><groupId>javax.media</groupId><artifactId>jmf</artifactId></exclusion>\n\t\t\t</exclusions>\n\t\t</dependency>'''
          if marker in s:
              s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8')
          PY

          while IFS=$'\t' read -r group artifact current latest; do
            if [[ "$current" == "$latest" ]]; then
              echo "| \`$group:$artifact\` | \`$current\` | \`$latest\` | already latest |" >> dependency-audit.md
              continue
            fi

            cp /tmp/original-pom.xml automation/pom.xml
            python3 - "$group" "$artifact" "$latest" <<'PY'
          from pathlib import Path
          import re, sys
          g, a, v = sys.argv[1:]
          p = Path('automation/pom.xml')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<dependency>\s*<groupId>' + re.escape(g) + r'</groupId>\s*<artifactId>' + re.escape(a) + r'</artifactId>\s*<version>)([^<]+)(</version>)', re.S)
          s2, n = pattern.subn(r'\g<1>' + v + r'\g<3>', s, count=1)
          if n != 1:
              raise SystemExit(f'could not update {g}:{a}')
          p.write_text(s2, encoding='utf-8')
          PY

            echo "Testing $group:$artifact $current -> $latest"
            if timeout 300s mvn -B -f automation/pom.xml -DskipTests=false clean test > /tmp/build.log 2>&1; then
              result='PASS'
            else
              code=$?
              if [[ $code -eq 124 ]]; then result='TIMEOUT'; else result='FAIL'; fi
              mkdir -p dependency-audit-logs
              safe="${group}_${artifact}"; safe="${safe//./_}"
              cp /tmp/build.log "dependency-audit-logs/${safe}.log"
            fi
            echo "| \`$group:$artifact\` | \`$current\` | \`$latest\` | **$result** |" >> dependency-audit.md
          done < /tmp/dependency-candidates.tsv

          cp /tmp/original-pom.xml automation/pom.xml
          cat dependency-audit.md

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-compatibility-audit
          path: |
            dependency-audit.md
            dependency-audit-logs/
          if-no-files-found: warn
