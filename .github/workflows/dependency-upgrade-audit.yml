name: Dependency Upgrade Audit

on:
  push:
    branches:
      - agent/update-maven-dependencies
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version
      - name: Display dependency updates
        working-directory: automation
        run: mvn -B -U org.codehaus.mojo:versions-maven-plugin:2.18.0:display-dependency-updates -DallowSnapshots=false
      - name: Display plugin updates
        working-directory: automation
        run: mvn -B -U org.codehaus.mojo:versions-maven-plugin:2.18.0:display-plugin-updates -DallowSnapshots=false
