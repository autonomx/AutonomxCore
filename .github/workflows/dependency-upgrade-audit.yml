name: Dependency Upgrade Final Audit

on:
  push:
    branches:
      - agent/update-maven-dependencies
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/update-maven-dependencies
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test AutonomxCore
        working-directory: automation
        run: mvn -B -U clean test

      - name: Display remaining dependency updates
        working-directory: automation
        run: mvn -B -U org.codehaus.mojo:versions-maven-plugin:2.18.0:display-dependency-updates -DallowSnapshots=false

      - name: Display remaining plugin updates
        working-directory: automation
        run: mvn -B -U org.codehaus.mojo:versions-maven-plugin:2.18.0:display-plugin-updates -DallowSnapshots=false
