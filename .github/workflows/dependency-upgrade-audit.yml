name: Dependency Upgrade Validation

on:
  push:
    branches:
      - agent/update-maven-dependencies
  workflow_dispatch:

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/update-maven-dependencies
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply source compatibility migrations
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_bytes().decode('utf-8')

          def write(path, text):
              Path(path).write_bytes(text.encode('utf-8'))

          pom_path = 'automation/pom.xml'
          pom = read(pom_path)
          if '<artifactId>maven-artifact</artifactId>' not in pom:
              model = re.compile(
                  r'(<dependency>\s*<groupId>org\.apache\.maven</groupId>\s*'
                  r'<artifactId>maven-model</artifactId>\s*<version>3\.9\.16</version>\s*</dependency>)'
              )
              artifact = (
                  '\n\n\t\t<dependency>\n'
                  '\t\t\t<groupId>org.apache.maven</groupId>\n'
                  '\t\t\t<artifactId>maven-artifact</artifactId>\n'
                  '\t\t\t<version>3.9.16</version>\n'
                  '\t\t</dependency>'
              )
              pom, count = model.subn(lambda m: m.group(1) + artifact, pom, count=1)
              if count != 1:
                  raise SystemExit('Could not add org.apache.maven:maven-artifact')
              write(pom_path, pom)

          location_files = [
              'automation/src/main/java/core/helpers/Helper.java',
              'automation/src/main/java/core/helpers/MobileHelper.java',
              'automation/src/main/java/core/helpers/legacy/Helper.java',
          ]
          for path in location_files:
              text = read(path)
              text = text.replace(
                  'import org.openqa.selenium.html5.Location;',
                  'import io.appium.java_client.Location;'
              )
              write(path, text)

          mobile_path = 'automation/src/main/java/core/helpers/MobileHelper.java'
          mobile = read(mobile_path)
          mobile = mobile.replace('import io.appium.java_client.SupportsLegacyAppManagement;\r\n', '')
          mobile = mobile.replace('import io.appium.java_client.SupportsLegacyAppManagement;\n', '')
          reset_pattern = re.compile(
              r'\tpublic void resetApp\(\) \{\s*'
              r'\(\(SupportsLegacyAppManagement\) getAppiumDriver\(\)\)\.resetApp\(\);\s*'
              r'TestLog\.logPass\("I reset the app"\);\s*\}'
          )
          if 'SupportsLegacyAppManagement' in mobile:
              nl = '\r\n' if '\r\n' in mobile else '\n'
              replacement = nl.join([
                  '\tpublic void resetApp() {',
                  '\t\tAppiumDriver driver = getAppiumDriver();',
                  '\t\tString capabilityName = isAndroid() ? "appium:appPackage" : "appium:bundleId";',
                  '\t\tObject appId = driver.getCapabilities().getCapability(capabilityName);',
                  '',
                  '\t\t// Accept legacy unprefixed capabilities for existing configurations.',
                  '\t\tif (appId == null) {',
                  '\t\t\tcapabilityName = isAndroid() ? "appPackage" : "bundleId";',
                  '\t\t\tappId = driver.getCapabilities().getCapability(capabilityName);',
                  '\t\t}',
                  '',
                  '\t\tif (appId == null)',
                  '\t\t\tthrow new IllegalStateException("Unable to restart app: missing appPackage/bundleId capability");',
                  '',
                  '\t\tInteractsWithApps appManagement = (InteractsWithApps) driver;',
                  '\t\tappManagement.terminateApp(appId.toString());',
                  '\t\tappManagement.activateApp(appId.toString());',
                  '',
                  '\t\tTestLog.logPass("I reset the app");',
                  '\t}',
              ])
              mobile, count = reset_pattern.subn(lambda _: replacement, mobile, count=1)
              if count != 1:
                  raise SystemExit('Could not migrate MobileHelper.resetApp')
          write(mobile_path, mobile)

          android_path = 'automation/src/main/java/core/uiCore/driverProperties/capabilities/AndroidCapability.java'
          android = read(android_path)
          for imp in [
              'import io.appium.java_client.remote.AndroidMobileCapabilityType;',
              'import io.appium.java_client.remote.MobileCapabilityType;',
          ]:
              android = android.replace(imp + '\r\n', '').replace(imp + '\n', '')
          android = android.replace('MobileCapabilityType.APP', '"appium:app"')
          android = android.replace('MobileCapabilityType.NO_RESET', '"appium:noReset"')
          android = android.replace('AndroidMobileCapabilityType.SYSTEM_PORT', '"appium:systemPort"')
          android = android.replace('setCapability("chromedriverExecutable",', 'setCapability("appium:chromedriverExecutable",')
          android = android.replace('setCapability("avd",', 'setCapability("appium:avd",')
          android = android.replace('setCapability("udid",', 'setCapability("appium:udid",')
          write(android_path, android)

          ios_path = 'automation/src/main/java/core/uiCore/driverProperties/capabilities/IosCapability.java'
          ios = read(ios_path)
          imp = 'import io.appium.java_client.remote.MobileCapabilityType;'
          ios = ios.replace(imp + '\r\n', '').replace(imp + '\n', '')
          ios = ios.replace('MobileCapabilityType.APP', '"appium:app"')
          ios = ios.replace('MobileCapabilityType.NO_RESET', '"appium:noReset"')
          ios = ios.replace('MobileCapabilityType.DEVICE_NAME', '"appium:deviceName"')
          ios = ios.replace('MobileCapabilityType.UDID', '"appium:udid"')
          ios = ios.replace('setCapability("wdaLocalPort",', 'setCapability("appium:wdaLocalPort",')
          ios = ios.replace('setCapability("chromedriverExecutable",', 'setCapability("appium:chromedriverExecutable",')
          write(ios_path, ios)

      - name: Commit compatibility changes when needed
        run: |
          if git diff --quiet; then
            echo "Source already migrated"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/pom.xml automation/src/main/java
            git commit -m "refactor: migrate to current dependency APIs"
            git push origin HEAD:agent/update-maven-dependencies
          fi

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and test AutonomxCore
        working-directory: automation
        run: mvn -B -U clean test
