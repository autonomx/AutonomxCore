name: Dependency Upgrade Consumer Validation

on:
  push:
    branches:
      - agent/update-maven-dependencies
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout upgraded AutonomxCore
        uses: actions/checkout@v5
        with:
          ref: agent/update-maven-dependencies
          path: core
          fetch-depth: 1

      - name: Restore listener and apply minimal TestNG null guard
        working-directory: core
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 26abaf0af909c52edfec8cfc49b99d687b868977
          git show FETCH_HEAD:automation/src/main/java/core/support/listeners/TestListener.java > /tmp/TestListener.java
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/TestListener.java').read_bytes()
          newline = b'\r\n' if b'\r\n' in source else b'\n'
          old = b'\t\tiTestContext.setAttribute("WebDriver", AbstractDriverTestNG.getWebDriver());'
          new = newline.join([
              b'\t\tObject webDriver = AbstractDriverTestNG.getWebDriver();',
              b'\t\tif (webDriver != null)',
              b'\t\t\tiTestContext.setAttribute("WebDriver", webDriver);',
          ])
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one WebDriver context assignment')
          Path('automation/src/main/java/core/support/listeners/TestListener.java').write_bytes(source.replace(old, new, 1))
          PY
          if git diff --quiet -- automation/src/main/java/core/support/listeners/TestListener.java; then
            echo "Listener already contains the minimal migration"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/src/main/java/core/support/listeners/TestListener.java
            git commit -m "fix: avoid null TestNG context attributes"
            git push origin HEAD:agent/update-maven-dependencies
          fi

      - name: Checkout Autonomx consumer
        uses: actions/checkout@v5
        with:
          repository: autonomx/Autonomx
          ref: master
          path: consumer

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install upgraded Core
        working-directory: core/automation
        run: mvn -B -U clean install

      - name: Point consumer at upgraded Core and modern Surefire
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('consumer/automation/pom.xml')
          text = path.read_text(encoding='utf-8')

          core_pattern = re.compile(
              r'<dependency>\s*'
              r'<groupId>io\.autonomx</groupId>\s*'
              r'<artifactId>autonomx-core</artifactId>\s*'
              r'<version>1\.1\.22</version>\s*'
              r'<exclusions>.*?</exclusions>\s*'
              r'</dependency>',
              re.DOTALL,
          )
          core_dependency = (
              '<dependency>\n'
              '          <groupId>io.autonomx</groupId>\n'
              '          <artifactId>autonomxCore</artifactId>\n'
              '          <version>1.1.23</version>\n'
              '        </dependency>'
          )
          text, core_count = core_pattern.subn(core_dependency, text, count=1)
          if core_count != 1:
              raise SystemExit('Could not replace AutonomxCore consumer dependency')

          for group, artifact in [
              ('io.github.bonigarcia', 'webdrivermanager'),
              ('io.appium', 'java-client'),
          ]:
              direct_pattern = re.compile(
                  r'<dependency>\s*'
                  r'<groupId>' + re.escape(group) + r'</groupId>\s*'
                  r'<artifactId>' + re.escape(artifact) + r'</artifactId>\s*'
                  r'<version>[^<]+</version>\s*'
                  r'</dependency>',
                  re.DOTALL,
              )
              text, count = direct_pattern.subn('', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not remove duplicate consumer dependency {group}:{artifact}')

          # Validation-only: the consumer's Surefire 2.22.1 cannot run the
          # Java 21 / current TestNG dependency graph.
          text = text.replace('<version>2.22.1</version>', '<version>3.5.4</version>')
          path.write_text(text, encoding='utf-8')

      - name: Verify Lombok is not exported by upgraded Core
        working-directory: consumer/automation
        run: |
          if mvn -B dependency:tree -Dincludes=org.projectlombok:lombok | grep 'org.projectlombok:lombok'; then
            echo 'Unexpected Lombok dependency remains in consumer graph'
            exit 1
          fi
          echo 'No Lombok processor exported to the consumer'

      - name: Start local framework test webapp
        run: |
          chmod +x consumer/test-webapp/start.sh
          (cd consumer/test-webapp && ./start.sh > "$RUNNER_TEMP/autonomx-test-webapp.log" 2>&1) &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              echo "Local test webapp is healthy"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autonomx-test-webapp.log" || true
          exit 1

      - name: Run Autonomx framework functional tests against upgraded Core
        working-directory: consumer/automation
        run: mvn -B -U clean compile test -DsuiteXmlFile=suites/frameworkFunctionalTests.xml

      - name: Upload consumer test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-core-functional-test-results
          if-no-files-found: ignore
          path: |
            consumer/automation/target/surefire-reports/**
            consumer/automation/reports/**
            consumer/automation/test-output/**
