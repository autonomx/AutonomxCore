name: Apply One Dependency Update

on:
  push:
    branches:
      - agent/update-pom-dependencies
    paths:
      - .github/dependency-update.txt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-pom-dependencies
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply requested dependency version
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r GROUP ARTIFACT VERSION < .github/dependency-update.txt
          export GROUP ARTIFACT VERSION
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          g = os.environ['GROUP'].strip()
          a = os.environ['ARTIFACT'].strip()
          v = os.environ['VERSION'].strip()
          p = Path('automation/pom.xml')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(<dependency>\s*<groupId>' + re.escape(g) +
              r'</groupId>\s*<artifactId>' + re.escape(a) +
              r'</artifactId>\s*<version>)([^<]+)(</version>)', re.S)
          updated, count = pattern.subn(r'\g<1>' + v + r'\g<3>', s, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one dependency {g}:{a}; found {count}')
          p.write_text(updated, encoding='utf-8')
          print(f'Applied {g}:{a}:{v}')
          PY

      - name: Apply dependency-specific source compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r GROUP ARTIFACT VERSION < .github/dependency-update.txt
          GROUP="$(echo "$GROUP" | xargs)"
          ARTIFACT="$(echo "$ARTIFACT" | xargs)"
          VERSION="$(echo "$VERSION" | xargs)"

          if [[ "$GROUP:$ARTIFACT:$VERSION" == "io.github.bonigarcia:webdrivermanager:6.3.4" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('automation/src/main/java/core/uiCore/WebDriverSetup.java')
          s = p.read_text(encoding='utf-8')
          old = 'manager = manager.useLocalVersionsPropertiesFirst();'
          new = 'manager = manager.avoidExternalConnections();'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Migrated WebDriverManager force-cache API to avoidExternalConnections()')
          elif new in s:
              print('WebDriverManager compatibility patch already present')
          else:
              raise SystemExit('Expected WebDriverManager force-cache call was not found')
          PY
          fi

          if [[ "$GROUP:$ARTIFACT:$VERSION" == "io.appium:java-client:10.1.1" ]]; then
            python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              data = p.read_bytes()
              newline = '\r\n' if b'\r\n' in data else '\n'
              old_bytes = old.replace('\n', newline).encode('utf-8')
              new_bytes = new.replace('\n', newline).encode('utf-8')
              if old_bytes in data:
                  p.write_bytes(data.replace(old_bytes, new_bytes, 1))
                  print(label)
              elif new and new_bytes in data:
                  print(f'{label} (already present)')
              elif not new:
                  print(f'{label} (already removed)')
              else:
                  raise SystemExit(f'Expected Appium compatibility source was not found in {path}: {old}')

          def replace_all(path, old, new, label):
              p = Path(path)
              data = p.read_bytes()
              old_bytes = old.encode('utf-8')
              new_bytes = new.encode('utf-8')
              count = data.count(old_bytes)
              if count:
                  p.write_bytes(data.replace(old_bytes, new_bytes))
                  print(f'{label} ({count} occurrence(s))')
              elif new_bytes in data:
                  print(f'{label} (already present)')
              else:
                  raise SystemExit(f'Expected Appium compatibility source was not found in {path}: {old}')

          helper = 'automation/src/main/java/core/helpers/Helper.java'
          mobile = 'automation/src/main/java/core/helpers/MobileHelper.java'
          legacy = 'automation/src/main/java/core/helpers/legacy/Helper.java'
          android = 'automation/src/main/java/core/uiCore/driverProperties/capabilities/AndroidCapability.java'
          ios = 'automation/src/main/java/core/uiCore/driverProperties/capabilities/IosCapability.java'
          junit_driver = 'automation/src/main/java/core/uiCore/drivers/AbstractDriverJunit.java'
          testng_driver = 'automation/src/main/java/core/uiCore/drivers/AbstractDriverTestNG.java'
          enhanced_element = 'automation/src/main/java/core/uiCore/webElement/ImpEnhancedWebElement.java'

          for path in (helper, mobile, legacy):
              replace_once(
                  path,
                  'import org.openqa.selenium.html5.Location;',
                  'import io.appium.java_client.Location;',
                  f'Migrated Location import in {path}',
              )

          replace_once(
              mobile,
              'import io.appium.java_client.SupportsLegacyAppManagement;',
              '',
              'Removed SupportsLegacyAppManagement import',
          )
          reset_replacement = '\n'.join([
              'AppiumDriver driver = getAppiumDriver();',
              '\t\tObject appIdValue = null;',
              '\t\tif (isAndroid()) {',
              '\t\t\tappIdValue = driver.getCapabilities().getCapability("appium:appPackage");',
              '\t\t\tif (appIdValue == null)',
              '\t\t\t\tappIdValue = driver.getCapabilities().getCapability("appPackage");',
              '\t\t} else if (isIOS()) {',
              '\t\t\tappIdValue = driver.getCapabilities().getCapability("appium:bundleId");',
              '\t\t\tif (appIdValue == null)',
              '\t\t\t\tappIdValue = driver.getCapabilities().getCapability("bundleId");',
              '\t\t}',
              '\t\tif (appIdValue == null)',
              '\t\t\tthrow new IllegalStateException("Unable to restart app: appPackage/bundleId capability is not available");',
              '\t\tString appId = appIdValue.toString();',
              '\t\tInteractsWithApps appManagement = (InteractsWithApps) driver;',
              '\t\tappManagement.terminateApp(appId);',
              '\t\tappManagement.activateApp(appId);',
          ])
          replace_once(
              mobile,
              '((SupportsLegacyAppManagement) getAppiumDriver()).resetApp();',
              reset_replacement,
              'Migrated resetApp() to terminateApp()/activateApp()',
          )

          replace_once(android, 'import io.appium.java_client.remote.AndroidMobileCapabilityType;', '',
                       'Removed AndroidMobileCapabilityType import')
          replace_once(android, 'import io.appium.java_client.remote.MobileCapabilityType;', '',
                       'Removed MobileCapabilityType import from Android capabilities')
          replace_all(android, 'MobileCapabilityType.APP', '"appium:app"', 'Migrated Android app capability')
          replace_all(android, 'MobileCapabilityType.NO_RESET', '"appium:noReset"', 'Migrated Android noReset capability')
          replace_all(android, 'AndroidMobileCapabilityType.SYSTEM_PORT', '"appium:systemPort"',
                      'Migrated Android systemPort capability')

          replace_once(ios, 'import io.appium.java_client.remote.MobileCapabilityType;', '',
                       'Removed MobileCapabilityType import from iOS capabilities')
          replace_all(ios, 'MobileCapabilityType.APP', '"appium:app"', 'Migrated iOS app capability')
          replace_all(ios, 'MobileCapabilityType.NO_RESET', '"appium:noReset"', 'Migrated iOS noReset capability')
          replace_all(ios, 'MobileCapabilityType.DEVICE_NAME', '"appium:deviceName"',
                      'Migrated iOS deviceName capability')
          replace_all(ios, 'MobileCapabilityType.UDID', '"appium:udid"', 'Migrated iOS udid capability')

          for path in (junit_driver, testng_driver, enhanced_element):
              replace_once(
                  path,
                  'import java.util.concurrent.TimeUnit;',
                  'import java.time.Duration;\nimport java.util.concurrent.TimeUnit;',
                  f'Added Duration import in {path}',
              )

          replace_once(
              junit_driver,
              'driver.manage().timeouts().implicitlyWait(5, TimeUnit.SECONDS);',
              'driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(5));',
              'Migrated JUnit implicit wait to Duration',
          )
          replace_once(
              junit_driver,
              'driver.manage().timeouts().pageLoadTimeout(AbstractDriver.TIMEOUT_SECONDS, TimeUnit.SECONDS);',
              'driver.manage().timeouts().pageLoadTimeout(Duration.ofSeconds(AbstractDriver.TIMEOUT_SECONDS));',
              'Migrated JUnit page load timeout to Duration',
          )
          replace_once(
              testng_driver,
              'driver.manage().timeouts().implicitlyWait(AbstractDriver.TIMEOUT_IMPLICIT_SECONDS, TimeUnit.SECONDS);',
              'driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(AbstractDriver.TIMEOUT_IMPLICIT_SECONDS));',
              'Migrated TestNG implicit wait to Duration',
          )
          replace_once(
              testng_driver,
              'driver.manage().timeouts().pageLoadTimeout(AbstractDriver.TIMEOUT_SECONDS, TimeUnit.SECONDS);',
              'driver.manage().timeouts().pageLoadTimeout(Duration.ofSeconds(AbstractDriver.TIMEOUT_SECONDS));',
              'Migrated TestNG page load timeout to Duration',
          )
          replace_once(
              enhanced_element,
              'webDriver.manage().timeouts().implicitlyWait(time, unit);',
              'webDriver.manage().timeouts().implicitlyWait(Duration.ofNanos(unit.toNanos(time)));',
              'Migrated element implicit wait to Duration',
          )
          PY
          fi

          if [[ "$GROUP:$ARTIFACT:$VERSION" == "org.apache.maven.plugins:maven-compiler-plugin:3.14.1" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('automation/pom.xml')
          s = p.read_text(encoding='utf-8')
          direct = '''\t\t<dependency>\n\t\t\t<groupId>org.apache.maven</groupId>\n\t\t\t<artifactId>maven-artifact</artifactId>\n\t\t\t<version>3.9.16</version>\n\t\t</dependency>'''
          if '<artifactId>maven-artifact</artifactId>' in s:
              print('Explicit maven-artifact dependency already present')
          else:
              marker = '''\t\t<dependency>\n\t\t\t<groupId>org.apache.maven.plugins</groupId>\n\t\t\t<artifactId>maven-compiler-plugin</artifactId>\n\t\t\t<version>3.14.1</version>\n\t\t</dependency>'''
              if marker not in s:
                  raise SystemExit('Updated maven-compiler-plugin dependency block was not found')
              s = s.replace(marker, marker + '\n\n' + direct, 1)
              p.write_text(s, encoding='utf-8')
              print('Declared maven-artifact explicitly for ComparableVersion usage')
          PY
          fi

      - name: Save exact files intended for commit
        shell: bash
        run: |
          cp automation/pom.xml /tmp/pom-to-commit.xml
          mkdir -p /tmp/source-to-commit/helpers/legacy
          mkdir -p /tmp/source-to-commit/uiCore/driverProperties/capabilities
          mkdir -p /tmp/source-to-commit/uiCore/drivers
          mkdir -p /tmp/source-to-commit/uiCore/webElement
          cp automation/src/main/java/core/uiCore/WebDriverSetup.java /tmp/source-to-commit/uiCore/WebDriverSetup.java
          cp automation/src/main/java/core/helpers/Helper.java /tmp/source-to-commit/helpers/Helper.java
          cp automation/src/main/java/core/helpers/MobileHelper.java /tmp/source-to-commit/helpers/MobileHelper.java
          cp automation/src/main/java/core/helpers/legacy/Helper.java /tmp/source-to-commit/helpers/legacy/Helper.java
          cp automation/src/main/java/core/uiCore/driverProperties/capabilities/AndroidCapability.java /tmp/source-to-commit/uiCore/driverProperties/capabilities/AndroidCapability.java
          cp automation/src/main/java/core/uiCore/driverProperties/capabilities/IosCapability.java /tmp/source-to-commit/uiCore/driverProperties/capabilities/IosCapability.java
          cp automation/src/main/java/core/uiCore/drivers/AbstractDriverJunit.java /tmp/source-to-commit/uiCore/drivers/AbstractDriverJunit.java
          cp automation/src/main/java/core/uiCore/drivers/AbstractDriverTestNG.java /tmp/source-to-commit/uiCore/drivers/AbstractDriverTestNG.java
          cp automation/src/main/java/core/uiCore/webElement/ImpEnhancedWebElement.java /tmp/source-to-commit/uiCore/webElement/ImpEnhancedWebElement.java

      - name: Apply CI-only monte-repack repository workaround
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('automation/pom.xml')
          s = p.read_text(encoding='utf-8')
          marker = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t</dependency>'''
          replacement = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t\t<exclusions>\n\t\t\t\t<exclusion><groupId>javax.media.jai</groupId><artifactId>com.springsource.javax.media.jai.core</artifactId></exclusion>\n\t\t\t\t<exclusion><groupId>javax.media</groupId><artifactId>jmf</artifactId></exclusion>\n\t\t\t</exclusions>\n\t\t</dependency>'''
          if marker in s:
              s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build with only this dependency upgrade
        run: mvn -B -f automation/pom.xml clean test

      - name: Commit passing dependency upgrade
        shell: bash
        run: |
          cp /tmp/pom-to-commit.xml automation/pom.xml
          cp /tmp/source-to-commit/uiCore/WebDriverSetup.java automation/src/main/java/core/uiCore/WebDriverSetup.java
          cp /tmp/source-to-commit/helpers/Helper.java automation/src/main/java/core/helpers/Helper.java
          cp /tmp/source-to-commit/helpers/MobileHelper.java automation/src/main/java/core/helpers/MobileHelper.java
          cp /tmp/source-to-commit/helpers/legacy/Helper.java automation/src/main/java/core/helpers/legacy/Helper.java
          cp /tmp/source-to-commit/uiCore/driverProperties/capabilities/AndroidCapability.java automation/src/main/java/core/uiCore/driverProperties/capabilities/AndroidCapability.java
          cp /tmp/source-to-commit/uiCore/driverProperties/capabilities/IosCapability.java automation/src/main/java/core/uiCore/driverProperties/capabilities/IosCapability.java
          cp /tmp/source-to-commit/uiCore/drivers/AbstractDriverJunit.java automation/src/main/java/core/uiCore/drivers/AbstractDriverJunit.java
          cp /tmp/source-to-commit/uiCore/drivers/AbstractDriverTestNG.java automation/src/main/java/core/uiCore/drivers/AbstractDriverTestNG.java
          cp /tmp/source-to-commit/uiCore/webElement/ImpEnhancedWebElement.java automation/src/main/java/core/uiCore/webElement/ImpEnhancedWebElement.java
          IFS='|' read -r GROUP ARTIFACT VERSION < .github/dependency-update.txt
          GROUP="$(echo "$GROUP" | xargs)"
          ARTIFACT="$(echo "$ARTIFACT" | xargs)"
          VERSION="$(echo "$VERSION" | xargs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/pom.xml \
            automation/src/main/java/core/uiCore/WebDriverSetup.java \
            automation/src/main/java/core/helpers/Helper.java \
            automation/src/main/java/core/helpers/MobileHelper.java \
            automation/src/main/java/core/helpers/legacy/Helper.java \
            automation/src/main/java/core/uiCore/driverProperties/capabilities/AndroidCapability.java \
            automation/src/main/java/core/uiCore/driverProperties/capabilities/IosCapability.java \
            automation/src/main/java/core/uiCore/drivers/AbstractDriverJunit.java \
            automation/src/main/java/core/uiCore/drivers/AbstractDriverTestNG.java \
            automation/src/main/java/core/uiCore/webElement/ImpEnhancedWebElement.java
          if git diff --cached --quiet; then
            echo "Dependency already at requested version; nothing to commit."
          else
            git commit -m "deps: update ${ARTIFACT} to ${VERSION}"
            git push origin HEAD:agent/update-pom-dependencies
          fi