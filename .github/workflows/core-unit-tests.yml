name: Core Unit Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-unit-tests:
    name: Java 11 core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: automation/pom.xml

      - name: Apply CI-only monte-repack repository workaround
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('automation/pom.xml')
          s = p.read_text(encoding='utf-8')
          marker = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t</dependency>'''
          replacement = '''\t\t<dependency>\n\t\t\t<groupId>com.pojosontheweb</groupId>\n\t\t\t<artifactId>monte-repack</artifactId>\n\t\t\t<version>1.1</version>\n\t\t\t<exclusions>\n\t\t\t\t<exclusion><groupId>javax.media.jai</groupId><artifactId>com.springsource.javax.media.jai.core</artifactId></exclusion>\n\t\t\t\t<exclusion><groupId>javax.media</groupId><artifactId>jmf</artifactId></exclusion>\n\t\t\t</exclusions>\n\t\t</dependency>'''
          if marker in s:
              s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Run Core unit tests with coverage
        shell: bash
        run: |
          mvn -B -f automation/pom.xml clean \
            org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.12:report \
            2>&1 | tee core-unit-tests-maven.log

      - name: Verify Core unit tests were discovered
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="automation/target/surefire-reports"
          if [ ! -d "$REPORT_DIR" ]; then
            echo "Surefire report directory was not created."
            exit 1
          fi

          TEST_REPORT_COUNT=$(find "$REPORT_DIR" -maxdepth 1 -type f -name 'TEST-*.xml' | wc -l | tr -d ' ')
          echo "Surefire XML reports: $TEST_REPORT_COUNT"
          if [ "$TEST_REPORT_COUNT" -lt 7 ]; then
            echo "Expected at least 7 Core unit-test report files; tests may not have been discovered."
            exit 1
          fi

      - name: Upload Core unit-test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            core-unit-tests-maven.log
            automation/target/surefire-reports/**
            automation/target/site/jacoco/**
            automation/target/jacoco.exec
